[package]
name = "gfs-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The gfs-server daemon: argument parsing, wiring, and startup"

# An entry point, not a library. Everything it serves lives in `gfs-service`;
# this crate turns a command line into a running `Server` and nothing else,
# which is what keeps `crates/` free of any dependency on the workspace root.
[[bin]]
name = "gfs-server"
path = "src/bin/gfs-server.rs"

[dependencies]
gfs-service = { workspace = true }
gfs-types = { workspace = true }
gfs-proto = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true }
axum = { workspace = true }
gfs-git = { workspace = true }

[dev-dependencies]
gfs-test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
