[package]
name = "xvfs-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Protobuf definitions and generated gRPC clients and servers"

[dependencies]
xvfs-types = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
# protoc is supplied by Cargo rather than required on the host. PLAN.md M1.1
# exists partly to stop local and CI environments drifting, and a host-installed
# protoc is exactly that kind of drift: the generated code would then depend on
# whatever version a given developer happened to have.
protoc-bin-vendored = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
prost-types = { workspace = true }
