syntax = "proto3";

package gfs.v1;

import "gfs/v1/common.proto";

// The snapshot and mount service (DESIGN.md section 7.3).
//
// Every read names an exact commit OID rather than a branch. DESIGN.md section
// 6.2: "A branch name is only a selector." `ResolveRevision` or `CreateMount`
// turns a selector into a commit once, and every later call names that commit, so
// a file from one branch generation cannot be combined with metadata or search
// results from another. Responses repeat the resolved commit for the same reason:
// a client that logs or caches a response can tell which generation it holds
// without tracking the request that produced it.
//
// ADR 0006's versioning policy applies to this file: additive-only within a major
// version, no field renumbering, no enum value repurposing, removed fields
// reserved and never reused. `golden.rs` pins the wire encoding so a renumbering
// fails a test rather than a deployed client.
service SnapshotService {
  // Turn a selector into a pinned commit. Does *not* create a retention lease,
  // so the commit it returns can still be pruned; use `CreateMount` for anything
  // that must stay readable.
  rpc ResolveRevision(ResolveRevisionRequest) returns (ResolveRevisionResponse);

  // Every ref the caller may see, with annotated tags peeled.
  //
  // The same set the Git gateway advertises to the same token, through the same
  // reserved-namespace filter -- ADR 0002's "one bare repository is one
  // authorization domain" is why this needs no mount capability and discloses
  // nothing `git ls-remote` does not.
  //
  // A workspace calls it once at mount time and writes `packed-refs`. Without
  // it the seeded `.git` has one branch and no tags, so `git describe` reports
  // "No names found", `origin/main` is an unknown revision, and `git status
  // -sb` has no upstream to count against -- all of which read as a corrupt
  // repository rather than as a surface that was never materialized.
  rpc ListRefs(ListRefsRequest) returns (ListRefsResponse);

  rpc GetCommit(GetCommitRequest) returns (GetCommitResponse);

  // One path. Returns gRPC `NOT_FOUND` when the path does not exist in the
  // commit, rather than an empty success: a negative lookup is a normal, frequent
  // FUSE result, and a distinct status lets the client cache it as negative
  // without inspecting the body.
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);

  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  // A whole subtree's directories in one round trip.
  //
  // `ListDirectory` answers one directory, and a client walking a tree asks it
  // once per directory: 5 328 serialized round trips for the first `git status`
  // in a vscode workspace. This answers all of them from one traversal, so a
  // client that recognizes a walk pays one call instead of thousands.
  //
  // Pages break **between** directories, never inside one, and the response
  // names the directories it described. That is what lets a client cache each
  // one as a *complete* listing -- the property that makes a cached listing able
  // to answer the absence of a name, not only its presence.
  rpc ListTree(ListTreeRequest) returns (ListTreeResponse);

  // The pinned commit's ancestry, newest first.
  //
  // A revwalk rather than a tree query, and the reason `git log` is answerable
  // at all in a workspace whose `.git` has no object database: ADR 0005 froze
  // the shim's `log` at `-1` because nothing could serve the second commit.
  // Paging is by `skip`, not by a token, because a revwalk from a pinned commit
  // is deterministic and repeating it is cheaper than carrying a cursor.
  rpc Log(LogRequest) returns (LogResponse);

  // What changed between two commits, rendered.
  //
  // The one thing a workspace cannot answer for itself and the reason this RPC
  // exists: ADR 0005 gave the mount no object database, so a client asking "what
  // did this commit change" could only walk trees and fetch blobs a piece at a
  // time -- the unbounded hydration the partial clone was rejected for. The
  // server *has* the object database and libgit2 renders Git's own patch format,
  // so one round trip answers it and the mount reads nothing.
  //
  // Rendering happens here rather than in the client for the same reason: a
  // client-side approximation of `git diff` is a second implementation of a
  // format that has to be byte-exact to be applied.
  rpc DiffCommits(DiffCommitsRequest) returns (DiffCommitsResponse);

  // Line-by-line attribution for one path at one commit.
  rpc Blame(BlameRequest) returns (BlameResponse);

  
  // Many paths in one round trip. Per-path failures travel in the response;
  // one unreadable path does not fail the batch.
  rpc BatchGetEntry(BatchGetEntryRequest) returns (BatchGetEntryResponse);

  // Ask for a snapshot manifest and search index generation to be built.
  // Implemented in M4; the RPC is defined here because its three-state lifecycle
  // is referenced across the system (DESIGN.md section 9).
  rpc PrepareSnapshot(PrepareSnapshotRequest) returns (PrepareSnapshotResponse);

  // Atomically resolve, authorize, and pin a commit for the life of a mount.
  //
  // DESIGN.md section 7.1: one server-side operation under the repository's
  // ref/maintenance lock -- resolve, authorize, write a durable `PREPARING`
  // lease, create the reachability anchor, mark it `ACTIVE`, and only then
  // return. There is deliberately no client-visible gap between resolution and
  // lease activation, because a force push in that gap would leave a mount
  // pinned to a prunable commit.
  rpc CreateMount(CreateMountRequest) returns (CreateMountResponse);

  // Extend a lease. Idempotent: replaying the same renewal is safe, which is
  // what makes a heartbeat that cannot tell whether its last attempt landed
  // recoverable.
  rpc RenewMount(RenewMountRequest) returns (RenewMountResponse);

  // Release a lease eagerly. Expiry is the crash fallback, not the normal path.
  rpc ReleaseMount(ReleaseMountRequest) returns (ReleaseMountResponse);
}

// ---------------------------------------------------------------------------
// Revision resolution
// ---------------------------------------------------------------------------

message ResolveRevisionRequest {
  string repository_id = 1;
  // A branch or tag name, `refs/...` ref, full object ID, or an abbreviation of
  // at least 7 hex characters. Revision *expressions* (`HEAD~1`, `main^{tree}`)
  // are rejected, and `refs/gfs/` is rejected as reserved.
  string revision_selector = 2;
}

message ResolveRevisionResponse {
  string commit_oid = 1;
  string tree_oid = 2;
  // The ref the selector named, if it named one. Absent when the selector was an
  // object ID.
  optional string ref_name = 3;
  // Monotonic per-ref version from the catalog, incremented on every observed
  // ref update.
  //
  // Exists so a caller can detect that a branch moved between two calls without
  // comparing commit OIDs, which cannot distinguish "unchanged" from "moved and
  // moved back". This is the mechanism behind M1's exit criterion that concurrent
  // ref movement cannot produce mixed-commit responses.
  uint64 ref_version = 4;
  // The stable sanitized snapshot time (ADR 0006), recorded once when the commit
  // was first cataloged. Never the raw committer timestamp, which Git allows to
  // be in the future.
  Timestamp snapshot_time = 5;
}

// ---------------------------------------------------------------------------
// Ref listing
// ---------------------------------------------------------------------------

message ListRefsRequest {
  string repository_id = 1;
}

message Ref {
  // The full name: `refs/heads/main`, `refs/tags/v1.0`.
  string name = 1;
  // What the ref points at directly -- a tag object for an annotated tag.
  string target_oid = 2;
  // The commit an annotated tag resolves to; empty when `target_oid` is already
  // one. Peeled by the server because the client's object database is a network
  // projection and the server has the object open.
  string peeled_oid = 3;
}

message ListRefsResponse {
  // Sorted by name, so two calls against an unchanged repository produce
  // identical bytes and a `packed-refs` file written from them is stable.
  repeated Ref refs = 1;
}

// ---------------------------------------------------------------------------
// Object reads
// ---------------------------------------------------------------------------

message GetCommitRequest {
  string repository_id = 1;
  string commit_oid = 2;
  SnapshotAuthorization authorization = 3;
}

// A Git identity line.
//
// Name and email are bytes: Git does not constrain them to UTF-8, and the M0
// spike's `from_utf8_lossy` silently replaced invalid sequences, which corrupts
// an author's name rather than reporting that it is unusual.
message Signature {
  bytes name = 1;
  bytes email = 2;
  Timestamp time = 3;
  int32 tz_offset_minutes = 4;
}

message GetCommitResponse {
  string commit_oid = 1;
  string tree_oid = 2;
  repeated string parent_oids = 3;
  Signature author = 4;
  Signature committer = 5;
  // Bytes, for the same reason as `Signature.name`.
  bytes message = 6;
  Timestamp snapshot_time = 7;
}

message LogRequest {
  string repository_id = 1;
  string commit_oid = 2;
  SnapshotAuthorization authorization = 3;
  // Commits to skip before emitting. Paging for `log --skip`.
  uint32 skip = 4;
  // Maximum commits to return. Zero takes the server's default; the server caps
  // it either way, because an unbounded revwalk on a 1.4-million-commit history
  // is a request to serialize the whole repository.
  uint32 limit = 5;
  // Follow only first parents, as `git log --first-parent` does.
  bool first_parent = 6;
  // Show only commits that changed one of these paths. A commit qualifies when
  // it is not TREESAME to any parent for them, which is Git's own default
  // simplification: for a merge that means the merge itself touched the path
  // rather than only inheriting a side branch's change.
  //
  // Rename following (`--follow`) is deliberately *not* implied. It is a
  // similarity search per commit, which is a different and much larger cost than
  // this tree comparison.
  repeated bytes paths = 7;
}

// One commit in a log. Deliberately not `GetCommitResponse`: that carries a
// `snapshot_time` and a `tree_oid` that mean something for the *pinned* commit
// and nothing for its ancestors, and reusing it would invite a client to read
// them as if they did.
message LogCommit {
  string commit_oid = 1;
  repeated string parent_oids = 2;
  Signature author = 3;
  Signature committer = 4;
  // Bytes, for the same reason as `Signature.name`.
  bytes message = 5;
  // The commit's tree. Present so `--format=%T` can be answered without a
  // `GetCommit` per line; unlike `GetCommitResponse.tree_oid` it says nothing
  // about what is pinned.
  string tree_oid = 6;
}

message LogResponse {
  repeated LogCommit commits = 1;
  // True when the walk stopped at the limit with ancestry still unvisited, so a
  // caller can tell "that is all of it" from "there is more". An empty page with
  // `has_more` false is the end of history, which is a different fact from a
  // truncated one.
  bool has_more = 2;
}

// ---------------------------------------------------------------------------
// Commit-to-commit diff
// ---------------------------------------------------------------------------

// How a diff is rendered. The structured per-file summary is returned whatever
// this says; only `patch` bytes change.
enum DiffFormat {
  DIFF_FORMAT_UNSPECIFIED = 0;
  // A unified `diff --git` patch.
  DIFF_FORMAT_PATCH = 1;
  // `git diff --stat`'s histogram.
  DIFF_FORMAT_STAT = 2;
  DIFF_FORMAT_NAME_STATUS = 3;
  DIFF_FORMAT_NAME_ONLY = 4;
}

// What happened to one path. Git's five, deliberately more than the two
// `TreeDelta` uses internally: a manifest treats "added" and "modified" as the
// same write, and a reader does not.
enum ChangeStatus {
  CHANGE_STATUS_UNSPECIFIED = 0;
  CHANGE_STATUS_ADDED = 1;
  CHANGE_STATUS_MODIFIED = 2;
  CHANGE_STATUS_DELETED = 3;
  CHANGE_STATUS_RENAMED = 4;
  CHANGE_STATUS_TYPE_CHANGED = 5;
}

message DiffCommitsRequest {
  string repository_id = 1;
  // The old side. Empty diffs against the empty tree, which is what a root
  // commit needs and is *not* the same as omitting the field by accident -- a
  // caller that means "the first parent" resolves it and names it.
  string base_commit_oid = 2;
  // The new side.
  string commit_oid = 3;
  SnapshotAuthorization authorization = 4;
  // Limit the diff to these paths. A directory limits to everything under it.
  repeated bytes paths = 5;
  DiffFormat format = 6;
  // Context lines around each hunk. Zero takes the server's default of 3, which
  // is `git diff`'s; a caller wanting no context sends the explicit sentinel
  // below rather than zero, for the same reason page sizes work that way.
  uint32 context_lines = 7;
  // Ceiling on the rendered bytes. Zero takes the server's default. Reaching it
  // sets `truncated` rather than failing: an agent reviewing a large commit is
  // better served by the first megabyte and a flag than by an error.
  uint64 max_bytes = 8;
  // Render with no context at all. Distinguishes "I want zero" from "I did not
  // set `context_lines`", which a bare uint32 cannot.
  bool zero_context = 9;
}

message DiffFileChange {
  bytes path = 1;
  // Where the content came from. Present only for a rename.
  bytes old_path = 2;
  ChangeStatus status = 3;
  uint32 additions = 4;
  uint32 deletions = 5;
  // True when Git treats the content as binary, in which case the counts are
  // zero and the patch carries a note instead of lines.
  bool binary = 6;
  uint32 old_mode = 7;
  uint32 new_mode = 8;
}

message DiffCommitsResponse {
  // The rendered diff, in the requested format. Bytes, because it contains file
  // content and paths, neither of which Git constrains to UTF-8.
  bytes rendered = 1;
  // Always populated, whatever the format, so a caller can act on the change set
  // without parsing the rendering.
  repeated DiffFileChange files = 2;
  bool truncated = 3;
  string base_commit_oid = 4;
  string commit_oid = 5;
}

// ---------------------------------------------------------------------------
// Blame
// ---------------------------------------------------------------------------

message BlameRequest {
  string repository_id = 1;
  string commit_oid = 2;
  bytes path = 3;
  SnapshotAuthorization authorization = 4;
}

// One contiguous run of lines attributed to one commit.
message BlameHunk {
  // 1-based line number in the file as of the blamed commit.
  uint32 final_start_line = 1;
  uint32 lines = 2;
  // The commit the lines are attributed to.
  string commit_oid = 3;
  // What the file was called in that commit, which differs from the blamed path
  // once the file has been renamed.
  bytes orig_path = 4;
  uint32 orig_start_line = 5;
  Signature author = 6;
  bool boundary = 7;
}

message BlameResponse {
  repeated BlameHunk hunks = 1;
  // The blamed file's bytes, so one round trip answers the whole question. Empty
  // when `truncated` is set.
  bytes content = 2;
  bool truncated = 3;
  string commit_oid = 4;
}

message FoundPath {
  bytes path = 1;
  EntryKind kind = 2;
  uint32 mode = 3;
}

message GetEntryRequest {
  string repository_id = 1;
  string commit_oid = 2;
  // Path from the snapshot root. Empty means the root itself.
  bytes path = 3;
  SnapshotAuthorization authorization = 4;
  // Whether to mint a blob ticket for the entry. Off by default: a ticket is
  // authorization state with an expiry, so it is issued when a caller intends to
  // read the blob rather than on every metadata lookup.
  bool want_blob_ticket = 5;
}

message GetEntryResponse {
  TreeEntry entry = 1;
  // Repeated so a client can confirm which snapshot answered.
  string commit_oid = 2;
}

message ListDirectoryRequest {
  string repository_id = 1;
  string commit_oid = 2;
  bytes path = 3;
  // Opaque continuation token from a previous response. Bytes rather than a
  // string because it *is* the Git tree sort key: an entry's name with `/`
  // appended for directories. That suffix is not cosmetic -- Git orders
  // `byteorder.h` before `byteorder/` because it compares the key, not the name
  // -- and paginating on raw names skips entries at page boundaries. The M0
  // spike measured that mistake returning 1597 of 1598 entries in the Linux
  // kernel's `include/linux`.
  bytes page_token = 4;
  // Zero means the server default.
  uint32 page_size = 5;
  SnapshotAuthorization authorization = 6;
  bool want_blob_tickets = 7;
}

message ListDirectoryResponse {
  repeated TreeEntry entries = 1;
  // Empty when this is the last page.
  bytes next_page_token = 2;
  string commit_oid = 3;
}

message ListTreeRequest {
  string repository_id = 1;
  string commit_oid = 2;
  // The subtree root. Empty means the whole snapshot.
  bytes path = 3;
  SnapshotAuthorization authorization = 4;
  // Soft ceiling on entries in one response. Zero takes the server default, and
  // the server caps it. Soft because a directory is never split across
  // responses: a page may exceed this by the size of its last directory, which
  // is the price of every returned directory being complete.
  uint32 max_entries = 5;
  // Opaque continuation from a previous response.
  bytes page_token = 6;
}

message ListTreeResponse {
  // Every entry of every directory in `directories`, in walk order: a
  // directory's own entry precedes its children's.
  repeated TreeEntry entries = 1;
  // The directories this response describes completely, including the walk
  // root. Carried separately because an empty directory contributes no entries,
  // and a client must be able to tell "listed, and empty" from "not listed" --
  // it caches the first as a complete listing and the second not at all. A
  // submodule appears here with no entries, matching `ListDirectory`'s empty
  // page for a gitlink.
  repeated bytes directories = 2;
  // Empty when the walk reached the end of the subtree.
  bytes next_page_token = 3;
  string commit_oid = 4;
}

message BatchGetEntryRequest {
  string repository_id = 1;
  string commit_oid = 2;
  repeated bytes paths = 3;
  SnapshotAuthorization authorization = 4;
  bool want_blob_tickets = 5;
}

// One result, positionally matched to the request's `paths`.
message EntryResult {
  oneof result {
    TreeEntry entry = 1;
    // A per-path failure, including `NOT_FOUND` for a path absent from the
    // commit. Carried here rather than as a request failure so one bad path
    // does not discard the rest of the batch.
    ErrorDetail error = 2;
  }
}

message BatchGetEntryResponse {
  // Same length and order as the request's `paths`.
  repeated EntryResult results = 1;
  string commit_oid = 2;
}

// ---------------------------------------------------------------------------
// Snapshot preparation
// ---------------------------------------------------------------------------

// Exactly three states.
//
// DESIGN.md section 7.3 is explicit that this is the whole lifecycle and that
// `NOT_INDEXABLE` and `RESOURCE_LIMIT` are *request error codes*, not states.
// Folding an error into a state is how a caller ends up treating "this will never
// work" as "try again shortly".
enum SnapshotState {
  SNAPSHOT_STATE_UNSPECIFIED = 0;
  SNAPSHOT_STATE_READY = 1;
  SNAPSHOT_STATE_BUILDING = 2;
  SNAPSHOT_STATE_FAILED = 3;
}

message PrepareSnapshotRequest {
  string repository_id = 1;
  string commit_oid = 2;
  SnapshotAuthorization authorization = 3;
}

message PrepareSnapshotResponse {
  SnapshotState state = 1;
  // Present when preparation exceeded the request deadline and continues in the
  // background. ADR 0006 sets the target at under 5 seconds to READY.
  optional string operation_id = 2;
  // Present only when state is FAILED.
  optional string failure_reason = 3;
  string commit_oid = 4;
}

// ---------------------------------------------------------------------------
// Mount lifecycle
// ---------------------------------------------------------------------------

message CreateMountRequest {
  string repository_id = 1;
  string revision_selector = 2;
  // Zero means the server's default TTL. ADR 0006 fixes it at 30 minutes and
  // the server caps any request at its configured maximum.
  uint64 requested_ttl_seconds = 3;
}

message CreateMountResponse {
  string mount_id = 1;
  string commit_oid = 2;
  string tree_oid = 3;
  optional string ref_name = 4;
  Timestamp snapshot_time = 5;
  // Unforgeable capability binding subject, repository, commit, mount ID, and
  // expiry. Required on later snapshot and blob calls once the commit is no
  // longer reachable from a visible ref.
  string mount_capability = 6;
  Timestamp lease_expiry = 7;
  // How often the client must renew, so the heartbeat interval comes from the
  // server rather than from a constant compiled into each client.
  uint64 heartbeat_interval_seconds = 8;
  // The caller's work-ref namespace root (`refs/gfs/work/<subject>`, no
  // trailing slash): the one subtree `git push` to the gateway may update. Sent
  // so the workspace can seed a push refspec without knowing how the server
  // folds subject ids into ref names.
  string work_ref_root = 9;
}

message RenewMountRequest {
  string mount_id = 1;
  string mount_capability = 2;
}

message RenewMountResponse {
  // A fresh capability. The old one remains valid until its own expiry, so a
  // renewal whose response was lost does not strand a daemon holding the
  // previous token.
  string mount_capability = 1;
  Timestamp lease_expiry = 2;
}

message ReleaseMountRequest {
  string mount_id = 1;
  string mount_capability = 2;
}

message ReleaseMountResponse {}
