[package]
name = "xvfs-fuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "FUSE filesystem adapter and the xvfsd mount daemon"

[[bin]]
name = "xvfsd"
path = "src/bin/xvfsd.rs"

[dependencies]
xvfs-types = { workspace = true }
xvfs-proto = { workspace = true }

fuser = { workspace = true }
libc = { workspace = true }
sha1 = { workspace = true }

tokio = { workspace = true }
tonic = { workspace = true }

# The blob endpoint is HTTP, not gRPC, because a blob wants ranges and ETag
# revalidation (DESIGN.md section 6.3). `hyper-util`'s pooled client rather than a
# fresh connection per read: a build opens thousands of files, and a TCP handshake
# per file would dominate the measured first-byte latency.
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
xvfs-test = { workspace = true }
xvfs-server = { path = "../xvfs-server" }
axum = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true
