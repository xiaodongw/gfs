[package]
name = "gfs-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Fixture matrix, fake server, and fault injection"

# The crash harness M3.4 kills mid-transaction. It is a separate *process*
# because unwinding runs `Drop`, and `Drop` is exactly what a crash does not do.
[[bin]]
name = "gfs-overlay-crash"
path = "src/bin/gfs-overlay-crash.rs"

[dependencies]
gfs-types = { workspace = true }
gfs-overlay = { workspace = true }
# The mount harness stands a real server up and mounts a real filesystem
# against it, so it needs both halves. Depending on them here is what lets the
# root `gfs-fuse` crate and `gfs-mount` share one harness.
gfs-mount = { workspace = true }
gfs-service = { workspace = true }
gfs-proto = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
axum = { workspace = true }
fuser = { workspace = true }

[lints]
workspace = true
