[workspace]
resolver = "2"
members = [
    "git-probe",
    "gateway-probe",
    "fuse-probe",
    "search-probe",
    "git-projection",
]

# M0 spike code. Deliberately separate from the `gfs-*` production workspace that
# M1.1 creates: these crates exist to produce measurements and are expected to be
# deleted, not maintained.

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
