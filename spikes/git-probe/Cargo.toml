[package]
name = "git-probe"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

# vendored-libgit2 is not a convenience here: it is the point. The supported
# repository-format boundary (reftable, SHA-256) is a property of the exact
# libgit2 build we ship, so the build must be ours and pinned, not whatever the
# host distribution happens to provide.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

# There is deliberately no `experimental-sha256` feature here. Enabling
# libgit2-sys's `unstable-sha256` makes `git2` itself fail to compile; see
# ./sha256-support-check.sh for the reproducer and docs/adr/0001 for the
# consequence.
