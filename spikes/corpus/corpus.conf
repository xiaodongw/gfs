# XVFS M0 benchmark corpus.
#
# Format: <id> <role> <url>
#
# role is one of:
#   worst-case  the repository the go/no-go gate is measured against
#   primary     a representative repository for the pilot's language mix
#   secondary   an additional shape (submodules, high churn, generated code)
#
# Replace these public stand-ins with the real target monorepos by editing this
# file; every script in spikes/ reads the corpus from here and takes no repo
# names of its own.

linux       worst-case  https://github.com/torvalds/linux.git
rust        secondary   https://github.com/rust-lang/rust.git
vscode      primary     https://github.com/microsoft/vscode.git
# Small enough to run the whole agent-workflow benchmark in under a minute, and
# high-ref: 29 298 refs on 788 MiB, which is what made the server's first-import
# ref reconciliation visible as a cost of its own.
django      secondary   https://github.com/django/django.git
